<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Oficina Pixel de Agentes</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a12;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      /* Controles tactiles: se muestran solo cuando el juego los activa
         (dispositivos sin teclado) via la clase touch-active en <body>. */
      #touch-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
        z-index: 10;
        font-family: inherit;
      }
      body.touch-active #touch-controls {
        display: block;
      }
      .tc-dpad, .tc-buttons {
        position: absolute;
        bottom: max(18px, env(safe-area-inset-bottom, 0px));
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .tc-dpad {
        left: 18px;
        width: 132px;
        height: 132px;
      }
      .tc-buttons {
        right: 18px;
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }
      .tc-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20, 20, 30, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        font-weight: 700;
        border-radius: 10px;
        touch-action: none;
      }
      .tc-btn:active, .tc-btn.pressed {
        background: rgba(255, 255, 255, 0.35);
      }
      .tc-dpad-btn {
        position: absolute;
        width: 44px;
        height: 44px;
        font-size: 18px;
        border-radius: 8px;
      }
      .tc-dpad-up    { top: 0;    left: 44px; }
      .tc-dpad-down  { bottom: 0; left: 44px; }
      .tc-dpad-left  { top: 44px; left: 0; }
      .tc-dpad-right { top: 44px; right: 0; }
      .tc-round {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 16px;
      }
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        background: #0a0a12;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      #rotate-hint.visible {
        display: flex;
      }
      #rotate-hint .icon {
        font-size: 42px;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="touch-controls" aria-hidden="true">
      <div class="tc-dpad">
        <div class="tc-btn tc-dpad-btn tc-dpad-up" data-dir="up">▲</div>
        <div class="tc-btn tc-dpad-btn tc-dpad-down" data-dir="down">▼</div>
        <div class="tc-btn tc-dpad-btn tc-dpad-left" data-dir="left">◀</div>
        <div class="tc-btn tc-dpad-btn tc-dpad-right" data-dir="right">▶</div>
      </div>
      <div class="tc-buttons">
        <div class="tc-btn tc-round" data-action="b">B</div>
        <div class="tc-btn tc-round" data-action="a">A</div>
      </div>
    </div>
    <div id="rotate-hint">
      <div class="icon">⟳</div>
      <div>Gira tu celular en horizontal para una mejor experiencia</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
